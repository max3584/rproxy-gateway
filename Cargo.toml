[package]
name = "rproxy-gateway"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
authors = ["touka shiro / max3584 <max3584.work@gmail.com>"]
description = "Kubernetes Gateway API controller for rproxy (drives rproxy-api through its control API)"
homepage = "https://github.com/max3584/rproxy-gateway"
repository = "https://github.com/max3584/rproxy-gateway"
readme = "README.md"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
jiff = "0.2"
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }
kube = { version = "4.2", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs", "sync", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
