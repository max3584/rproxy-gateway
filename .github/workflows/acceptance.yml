name: acceptance

# Acceptance test: HA, TLS and state recovery under continuous traffic on a multi-node kind
# cluster with cert-manager, behind one of several load balancer topologies (scripts/acceptance.sh).
# Either the PUBLISHED chart and images (oci://ghcr.io/max3584/charts/rproxy-gateway), or the chart
# of the ref the workflow runs on with a controller image built from it (rproxy: the chart's
# published image). Heavy: run by hand only, e.g.
#   gh workflow run acceptance.yml --ref <branch> -f source=checkout -f topology=bgp
on:
  workflow_dispatch:
    inputs:
      source:
        description: "published (chart_version from the registry) or checkout (this ref's chart, controller built from it)"
        required: false
        default: published
        type: choice
        options: [published, checkout]
      chart_version:
        description: "chart version to install (source: published)"
        required: false
        default: "0.4.0"
      topology:
        description: "how traffic reaches rproxy (scripts/acceptance.sh; bgp uses externalTrafficPolicy Cluster unless helm_args sets it)"
        required: false
        default: l2-local
        type: choice
        options: [l2-local, l2-cluster, bgp, nodeport-lb]
      managed_replicas:
        description: "rproxy replicas per Gateway (managed.replicas)"
        required: false
        default: "2"
      helm_args:
        description: "more helm flags (e.g. --set managed.preStopSeconds=10)"
        required: false
        default: ""
      gap_limit:
        description: "seconds without a 200 a pod deletion, drain or rollout may cause (replicas >= 2)"
        required: false
        default: "3"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (musl)
    if: inputs.source == 'checkout'
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: mkdir -p dist/amd64 && cp target/release/rproxy-gateway dist/amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: rproxy-gateway
          path: dist/amd64/rproxy-gateway

  acceptance:
    name: acceptance (${{ inputs.source || 'published' }}, ${{ inputs.topology || 'l2-local' }})
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    # kind runs the nodes as Docker containers: on the runner VM (like e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.source == 'checkout'
        with:
          name: rproxy-gateway
          path: dist/amd64
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: scripts/acceptance.sh
        env:
          SOURCE: ${{ inputs.source || 'published' }}
          CHART_VERSION: ${{ inputs.chart_version || '0.4.0' }}
          TOPOLOGY: ${{ inputs.topology || 'l2-local' }}
          MANAGED_REPLICAS: ${{ inputs.managed_replicas || '2' }}
          HELM_ARGS: ${{ inputs.helm_args }}
          GAP_LIMIT: ${{ inputs.gap_limit || '3' }}
        run: scripts/acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-logs-${{ inputs.topology || 'l2-local' }}
          path: ${{ runner.temp }}/rproxy-gateway-acceptance
