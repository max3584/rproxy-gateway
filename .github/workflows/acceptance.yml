name: acceptance

# Acceptance test: HA, TLS and state recovery under continuous traffic on a multi-node kind
# cluster with cert-manager, behind one of several load balancer topologies (scripts/acceptance.sh).
# Either the PUBLISHED chart and images (oci://ghcr.io/max3584/charts/rproxy-gateway), or the chart
# of the ref the workflow runs on with a controller image built from it (rproxy: the chart's
# published image). Heavy: run by hand only, e.g.
#   gh workflow run acceptance.yml --ref <branch> -f source=checkout -f topology=bgp
# fleet with a VIP held by the fleet's pods (the vip sidecar), e.g.
#   gh workflow run acceptance.yml --ref <branch> -f source=checkout -f mode=fleet-vip
# The UI (TCP-UDP-rproxy-ui's chart and image from ui_ref, bundled MariaDB) only, e.g.
#   gh workflow run acceptance.yml --ref <branch> -f source=checkout -f ui=true -f ui_ref=main -f scenarios=u
on:
  workflow_dispatch:
    inputs:
      source:
        description: "published (chart_version from the registry) or checkout (this ref's chart, controller built from it)"
        required: false
        default: published
        type: choice
        options: [published, checkout]
      chart_version:
        description: "chart version to install (source: published)"
        required: false
        default: "0.4.0"
      topology:
        description: "how traffic reaches rproxy (scripts/acceptance.sh; bgp is record-only: its gaps are the network's)"
        required: false
        default: l2-local
        type: choice
        options: [l2-local, l2-cluster, bgp, nodeport-lb]
      mode:
        description: "managed (topology decides how traffic reaches the Gateway) or fleet-vip (fleet with a VIP held by the fleet's pods; scenarios j k l o n m)"
        required: false
        default: managed
        type: choice
        options: [managed, fleet-vip]
      managed_replicas:
        description: "rproxy replicas per Gateway (managed.replicas)"
        required: false
        default: "2"
      helm_args:
        description: "more helm flags (e.g. --set managed.preStopSeconds=10)"
        required: false
        default: ""
      gap_limit:
        description: "seconds without a 200 a pod deletion, drain, rollout or parameters change may cause (replicas >= 2; l2-local, l2-cluster, nodeport-lb; bgp and a lost node are recorded only)"
        required: false
        default: "3"
      strict:
        description: "those scenarios also fail on any failed request (not only on a gap over gap_limit)"
        required: false
        default: false
        type: boolean
      scenarios:
        description: "scenarios to run (scripts/acceptance.sh; u is added with ui)"
        required: false
        default: "a b1 b2 c d e f g h i"
      ui:
        description: "also install the UI chart (TCP-UDP-rproxy-ui at ui_ref, image built from it, bundled MariaDB) with ui.namespace and check it (scenario u)"
        required: false
        default: false
        type: boolean
      ui_ref:
        description: "TCP-UDP-rproxy-ui branch, tag or SHA (ui)"
        required: false
        default: main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (musl)
    if: inputs.source == 'checkout'
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: mkdir -p dist/amd64 && cp target/release/rproxy-gateway dist/amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: rproxy-gateway
          path: dist/amd64/rproxy-gateway

  acceptance:
    name: acceptance (${{ inputs.source || 'published' }}, ${{ inputs.mode == 'fleet-vip' && 'fleet-vip' || inputs.topology || 'l2-local' }})
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    # kind runs the nodes as Docker containers: on the runner VM (like e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.source == 'checkout'
        with:
          name: rproxy-gateway
          path: dist/amd64
      - uses: actions/checkout@v4
        if: inputs.ui
        with:
          repository: max3584/TCP-UDP-rproxy-ui
          ref: ${{ inputs.ui_ref || 'main' }}
          path: ui-src
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: scripts/acceptance.sh
        env:
          SOURCE: ${{ inputs.source || 'published' }}
          CHART_VERSION: ${{ inputs.chart_version || '0.4.0' }}
          TOPOLOGY: ${{ inputs.topology || 'l2-local' }}
          MODE: ${{ inputs.mode || 'managed' }}
          MANAGED_REPLICAS: ${{ inputs.managed_replicas || '2' }}
          HELM_ARGS: ${{ inputs.helm_args }}
          GAP_LIMIT: ${{ inputs.gap_limit || '3' }}
          STRICT: ${{ inputs.strict && 'true' || 'false' }}
          # fleet-vip: its own default (j k l o n m) unless scenarios are given
          SCENARIOS: ${{ (inputs.mode == 'fleet-vip' && inputs.scenarios == 'a b1 b2 c d e f g h i') && 'j k l o n m' || inputs.scenarios || 'a b1 b2 c d e f g h i' }}
          UI: ${{ inputs.ui && 'true' || 'false' }}
          UI_DIR: ${{ github.workspace }}/ui-src
        run: scripts/acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-logs-${{ inputs.mode == 'fleet-vip' && 'fleet-vip' || inputs.topology || 'l2-local' }}
          path: ${{ runner.temp }}/rproxy-gateway-acceptance
