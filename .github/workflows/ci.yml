name: CI

# ジョブは Alpine のコンテナ（musl。イメージのバイナリと同じ）で動かす（rproxy-api と同じ方針）。
# 例外は kind を使う e2e と conformance だけ（e2e.yml）：kind は Docker でノードのコンテナを作るので、
# Docker のあるランナーの VM で直接動かす。そこでは Rust をビルドせず、Alpine のジョブが作ったバイナリを使う。
on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      # git: actions/checkout、tar・zstd: actions/cache（busybox の tar では足りない）、gcc・musl-dev: ring
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: tests
        run: cargo test --locked --all-targets

  lint:
    name: chart + scripts
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git helm shellcheck
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: helm lint
        run: |
          helm lint charts/rproxy-gateway
          helm lint charts/rproxy-gateway --set fleet.enabled=true --set migration.migrateTo=default/gw --set migration.createIngressClass=true
      - name: helm template
        run: |
          for args in "" "--set fleet.enabled=true" "--set migration.migrateTo=default/gw" "--set managed.parameters.replicas=2 --set rbac.aggregateToAdmin=false"; do
            # shellcheck disable=SC2086
            helm template t charts/rproxy-gateway -n rproxy-gateway-system $args > /dev/null
          done
          # fleet.vip (removed in 0.4.5) stops helm instead of being ignored
          if helm template t charts/rproxy-gateway --set fleet.enabled=true --set fleet.vip.enabled=true > /dev/null 2> "$RUNNER_TEMP/vip.err"; then
            echo "fleet.vip should fail"; exit 1
          fi
          grep -q 'fleet.vip was removed' "$RUNNER_TEMP/vip.err"

  config:
    name: config (kustomize)
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git curl tar helm kustomize
      - uses: actions/checkout@v4
      - name: kubeconform
        run: curl -sfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      # config/ is rendered from the chart (scripts/render-config.sh), never edited by hand
      - name: config/ matches the chart
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/render-config.sh
          if [ -n "$(git status --porcelain config/)" ]; then
            git status --porcelain config/
            git diff config/
            echo "::error::config/ differs from the chart: run scripts/render-config.sh and commit config/"
            exit 1
          fi
      - name: kustomize build + kubeconform
        shell: bash
        run: |
          for d in config/default config/fleet config/samples/*/; do
            echo "== $d"
            kustomize build "$d" | kubeconform -strict -summary -ignore-missing-schemas -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
