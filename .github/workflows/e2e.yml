name: e2e

# rproxy-gateway against a real rproxy (rproxy-api built from RPROXY_REF):
# - "real rproxy (rule sets)": tests/rproxy.rs in an Alpine container (no Kubernetes)
# - "e2e (kind)" and "Gateway API conformance": on the runner VM, since kind runs the
#   cluster's nodes as Docker containers (the Alpine job container has no Docker
#   daemon; docker-in-docker would need a privileged nested daemon). There, nothing is
#   built from Rust: the binaries come from the Alpine jobs.
# - by hand with report_version: only "conformance report (published)", the report for submission to
#   kubernetes-sigs/gateway-api from the published chart and images of a release (nothing built), e.g.
#     gh workflow run e2e.yml -f report_version=0.4.5
#   The artifact conformance-report-v<version> has the report as the suite wrote it
#   (<channel>-v<version>-default-report.yaml), the suite's and the controller's logs and the
#   environment (versions, image digests). It fails unless every profile is core and extended success
#   with nothing skipped.
# - by hand with compat: only "compat", the e2e and the conformance suite on older (and the next)
#   Kubernetes and Gateway API versions (see the matrix), e.g.
#     gh workflow run e2e.yml -f compat=true
#   e2e must pass on every pair (rproxy-gateway works there); conformance is recorded only (older
#   suites do not know the newer features; the artifact compat-<k8s>-<gateway api> has the report).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rproxy_ref:
        description: "rproxy-api ref to build rproxy from"
        required: false
      report_version:
        description: "only the conformance report for submission upstream, from the PUBLISHED chart and images of this released version (e.g. 0.4.5; scripts/conformance-report.sh). Empty: the usual jobs"
        required: false
        default: ""
      compat:
        description: "only the compatibility matrix: e2e (must pass) and conformance (recorded) on older and next Kubernetes / Gateway API versions"
        required: false
        default: false
        type: boolean
      report_channel:
        description: "report_version: the Gateway API channel of the CRDs (experimental: the claimed HTTPRouteRetry* use experimental fields)"
        required: false
        default: experimental
        type: choice
        options: [experimental, standard]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rproxy-api master has the rule sets (#28) and the Gateway API settings (#237); another ref
  # (a release tag, a branch) by hand
  RPROXY_REF: ${{ inputs.rproxy_ref || 'master' }}

jobs:
  build:
    name: build (musl)
    if: ${{ !inputs.report_version }}
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: mkdir -p dist/amd64 && cp target/release/rproxy-gateway dist/amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: rproxy-gateway
          path: dist/amd64/rproxy-gateway

  rproxy:
    name: rproxy (rproxy-api)
    if: ${{ !inputs.report_version }}
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - name: rproxy-api commit
        id: ref
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/max3584/rproxy-api.git "$RPROXY_REF" | head -1 | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote https://github.com/max3584/rproxy-api.git master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: dist/amd64/rproxy-api
          key: rproxy-api-musl-${{ steps.ref.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache.outputs.cache-hit != 'true'
      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/build-rproxy.sh "${{ steps.ref.outputs.sha }}" dist/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: rproxy-api
          path: dist/amd64/rproxy-api

  real:
    name: real rproxy (rule sets)
    if: ${{ !inputs.report_version && !inputs.compat }}
    needs: rproxy
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: rproxy-api
          path: dist/amd64
      - name: tests/rproxy.rs
        env:
          RPROXY_TEST_REQUIRE: "1"
        run: |
          chmod +x dist/amd64/rproxy-api
          RPROXY_BIN=$PWD/dist/amd64/rproxy-api cargo test --locked --test rproxy -- --nocapture

  kind:
    name: e2e (kind)
    if: ${{ !inputs.report_version && !inputs.compat }}
    needs: [build, rproxy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/amd64
          merge-multiple: true
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: scripts/e2e.sh
        env:
          MIGRATE: e2e/e2e
        run: scripts/e2e.sh

  conformance:
    name: Gateway API conformance
    if: ${{ !inputs.report_version && !inputs.compat }}
    needs: [build, rproxy]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/amd64
          merge-multiple: true
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: scripts/conformance.sh
        run: scripts/conformance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: |
            conformance-report.yaml
            ${{ runner.temp }}/rproxy-gateway-conformance/conformance.log
            ${{ runner.temp }}/rproxy-gateway-conformance/controller.log
      # core must pass (a regression fails the job); extended failures are reported, not blocking
      - name: core
        run: |
          f="$RUNNER_TEMP/rproxy-gateway-conformance/core-failures"
          if [ -s "$f" ]; then echo "::error::Gateway API conformance: core tests failed"; cat "$f"; exit 1; fi
      - name: extended
        continue-on-error: true
        run: exit "$(cat "$RUNNER_TEMP/rproxy-gateway-conformance/status")"

  compat:
    name: compat (k8s ${{ matrix.k8s }}, Gateway API ${{ matrix.gwapi }})
    if: ${{ inputs.compat }}
    needs: [build, rproxy]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest Kubernetes the chart allows (kubeVersion >=1.29) with an older Gateway API
          - { k8s: v1.29.14, gwapi: v1.4.1 }
          - { k8s: v1.31.14, gwapi: v1.5.1 }
          - { k8s: v1.33.12, gwapi: v1.6.3 }
          - { k8s: v1.37.0, gwapi: v1.6.3 }
          # the next Gateway API (release candidate), to be ready when it ships
          - { k8s: v1.37.0, gwapi: v1.7.0-rc.1 }
    env:
      KIND_NODE_IMAGE: kindest/node:${{ matrix.k8s }}
      GATEWAY_API_VERSION: ${{ matrix.gwapi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/amd64
          merge-multiple: true
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      # rproxy-gateway works here: the same e2e as on every PR, against this Kubernetes and these CRDs
      - name: scripts/e2e.sh
        env:
          MIGRATE: e2e/e2e
          GATEWAY_API_CHANNEL: experimental
        run: scripts/e2e.sh
      - name: controller log
        if: always()
        run: kubectl -n rproxy-gateway-system logs deploy/rproxy-gateway --tail=200 || true
      - name: delete the e2e cluster
        if: always()
        run: kind delete cluster --name rproxy-gateway || true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # recorded only: an older suite does not know the newer features
      - name: scripts/conformance.sh (recorded)
        continue-on-error: true
        run: scripts/conformance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ matrix.k8s }}-${{ matrix.gwapi }}
          path: |
            conformance-report.yaml
            ${{ runner.temp }}/rproxy-gateway-conformance/conformance.log
            ${{ runner.temp }}/rproxy-gateway-conformance/controller.log

  report:
    name: conformance report (published)
    if: ${{ inputs.report_version != '' && inputs.report_version != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: scripts/conformance-report.sh
        env:
          VERSION: ${{ inputs.report_version }}
          GATEWAY_API_CHANNEL: ${{ inputs.report_channel }}
          OUT_DIR: ${{ github.workspace }}/conformance-report
        run: scripts/conformance-report.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report-v${{ inputs.report_version }}
          path: conformance-report/
