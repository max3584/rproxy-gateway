name: e2e

# rproxy-gateway against a real rproxy (rproxy-api built from RPROXY_REF):
# - "real rproxy (rule sets)": tests/rproxy.rs in an Alpine container (no Kubernetes)
# - "e2e (kind)" and "Gateway API conformance": on the runner VM, since kind runs the
#   cluster's nodes as Docker containers (the Alpine job container has no Docker
#   daemon; docker-in-docker would need a privileged nested daemon). There, nothing is
#   built from Rust: the binaries come from the Alpine jobs.
# - by hand with report_version: only "conformance report (published)", the report for submission to
#   kubernetes-sigs/gateway-api from the published chart and images of a release (nothing built), e.g.
#     gh workflow run e2e.yml -f report_version=0.4.5
#   The artifact conformance-report-v<version> has the report as the suite wrote it
#   (<channel>-v<version>-default-report.yaml), the suite's and the controller's logs and the
#   environment (versions, image digests). It fails unless every profile is core and extended success
#   with nothing skipped.
# - by hand with compat, and every week (schedule): only "compat", the e2e and the conformance suite on
#   every Kubernetes and Gateway API version from the oldest to the newest released and the next one
#   (scripts/compat-matrix.py works the matrix out at run time), e.g.
#     gh workflow run e2e.yml -f compat=true
#   e2e must pass on every pair the chart allows (rproxy-gateway works there); conformance core must pass
#   on the latest two Gateway API minors, the others are recorded (the artifact compat-<k8s>-<gateway api>
#   has result.json and the report; "compat summary" puts them in one table). A weekly run that fails
#   opens an issue (or comments on the open one).
# - by hand with stress: only "stress", random HTTP / TCP / UDP requests (stress_total, default 120000)
#   through a Gateway with every byte checked (scripts/stress.sh, test/stress), e.g.
#     gh workflow run e2e.yml -f stress=true
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # every Monday, 04:23 JST: a new Kubernetes or Gateway API release is in the next run
    - cron: "23 19 * * 0"
  workflow_dispatch:
    inputs:
      rproxy_ref:
        description: "rproxy-api ref to build rproxy from"
        required: false
      report_version:
        description: "only the conformance report for submission upstream, from the PUBLISHED chart and images of this released version (e.g. 0.4.5; scripts/conformance-report.sh). Empty: the usual jobs"
        required: false
        default: ""
      compat:
        description: "only the compatibility matrix: e2e (must pass) and conformance (recorded) on older and next Kubernetes / Gateway API versions"
        required: false
        default: false
        type: boolean
      stress:
        description: "only the stress test: random HTTP / TCP / UDP requests through a Gateway, every byte checked (scripts/stress.sh)"
        required: false
        default: false
        type: boolean
      stress_total:
        description: "stress: requests in all (at least 100000)"
        required: false
        default: "120000"
      report_channel:
        description: "report_version: the Gateway API channel of the CRDs (experimental: the claimed HTTPRouteRetry* use experimental fields)"
        required: false
        default: experimental
        type: choice
        options: [experimental, standard]

permissions:
  contents: read

concurrency:
  # the weekly run and a run by hand on main do not cancel a push's run (or each other)
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rproxy-api master has the rule sets (#28) and the Gateway API settings (#237); another ref
  # (a release tag, a branch) by hand
  RPROXY_REF: ${{ inputs.rproxy_ref || 'master' }}

jobs:
  build:
    name: build (musl)
    if: ${{ !inputs.report_version }}
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release
      - run: mkdir -p dist/amd64 && cp target/release/rproxy-gateway dist/amd64/
      - uses: actions/upload-artifact@v4
        with:
          name: rproxy-gateway
          path: dist/amd64/rproxy-gateway

  rproxy:
    name: rproxy (rproxy-api)
    if: ${{ !inputs.report_version }}
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - name: rproxy-api commit
        id: ref
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/max3584/rproxy-api.git "$RPROXY_REF" | head -1 | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote https://github.com/max3584/rproxy-api.git master | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: dist/amd64/rproxy-api
          key: rproxy-api-musl-${{ steps.ref.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cache.outputs.cache-hit != 'true'
      - name: build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/build-rproxy.sh "${{ steps.ref.outputs.sha }}" dist/amd64
      - uses: actions/upload-artifact@v4
        with:
          name: rproxy-api
          path: dist/amd64/rproxy-api

  real:
    name: real rproxy (rule sets)
    if: ${{ !inputs.report_version && !inputs.compat && !inputs.stress && github.event_name != 'schedule' }}
    needs: rproxy
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: packages
        run: apk add --no-cache bash git tar zstd curl gcc musl-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: rproxy-api
          path: dist/amd64
      - name: tests/rproxy.rs
        env:
          RPROXY_TEST_REQUIRE: "1"
        run: |
          chmod +x dist/amd64/rproxy-api
          RPROXY_BIN=$PWD/dist/amd64/rproxy-api cargo test --locked --test rproxy -- --nocapture

  kind:
    name: e2e (kind)
    if: ${{ !inputs.report_version && !inputs.compat && !inputs.stress && github.event_name != 'schedule' }}
    needs: [build, rproxy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # the binaries only (rproxy-gateway, rproxy-api), not the reports other jobs upload meanwhile
          pattern: rproxy-*
          path: dist/amd64
          merge-multiple: true
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: scripts/e2e.sh
        env:
          MIGRATE: e2e/e2e
        run: scripts/e2e.sh

  conformance:
    name: Gateway API conformance
    if: ${{ !inputs.report_version && !inputs.compat && !inputs.stress && github.event_name != 'schedule' }}
    needs: [build, rproxy]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # the binaries only (rproxy-gateway, rproxy-api), not the reports other jobs upload meanwhile
          pattern: rproxy-*
          path: dist/amd64
          merge-multiple: true
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: scripts/conformance.sh
        run: scripts/conformance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report
          path: |
            conformance-report.yaml
            ${{ runner.temp }}/rproxy-gateway-conformance/conformance.log
            ${{ runner.temp }}/rproxy-gateway-conformance/controller.log
      # core must pass (a regression fails the job); extended failures are reported, not blocking
      - name: core
        run: |
          f="$RUNNER_TEMP/rproxy-gateway-conformance/core-failures"
          if [ -s "$f" ]; then echo "::error::Gateway API conformance: core tests failed"; cat "$f"; exit 1; fi
      - name: extended
        continue-on-error: true
        run: exit "$(cat "$RUNNER_TEMP/rproxy-gateway-conformance/status")"

  # the compatibility matrix, from what is released today (scripts/compat-matrix.py)
  matrix:
    name: compat matrix
    if: ${{ (inputs.compat || github.event_name == 'schedule') && !inputs.stress }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
      builds: ${{ steps.m.outputs.builds }}
      kind: ${{ steps.m.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          m=$(scripts/compat-matrix.py)
          jq . <<< "$m"
          {
            echo "include=$(jq -c .include <<< "$m")"
            echo "builds=$(jq -c .builds <<< "$m")"
            echo "kind=$(jq -r .kind <<< "$m")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Compatibility matrix ($(jq '.include | length' <<< "$m") pairs, kind $(jq -r .kind <<< "$m"))"
            echo
            echo "| Kubernetes | Gateway API | kind | node image |"
            echo "|---|---|---|---|"
            jq -r '.include[] | "| \(.k8s) | \(.gwapi) | \(if .strict then "strict" elif .floor then "floor (recorded)" else "recorded" end) | \(.image) |"' <<< "$m"
          } >> "$GITHUB_STEP_SUMMARY"

  # node images kind has not published (the newest patch, the next minor's beta / rc): built once from
  # the Kubernetes release and kept in GHCR for the next runs
  node-images:
    name: node image ${{ matrix.k8s }}
    needs: matrix
    if: ${{ needs.matrix.outputs.builds != '[]' && needs.matrix.outputs.builds != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        k8s: ${{ fromJSON(needs.matrix.outputs.builds) }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}/kind-node:${{ matrix.k8s }}
    steps:
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: have
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then echo "have=true" >> "$GITHUB_OUTPUT"; fi
      - name: kind
        if: steps.have.outputs.have != 'true'
        run: |
          curl -sLo "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${{ needs.matrix.outputs.kind }}/kind-linux-amd64"
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: kind build node-image
        if: steps.have.outputs.have != 'true'
        run: |
          kind build node-image --type release "${{ matrix.k8s }}" --image "$IMAGE"
          docker push "$IMAGE"

  compat:
    name: compat (k8s ${{ matrix.k8s }}, Gateway API ${{ matrix.gwapi }})
    # node-images is skipped when kind has every image
    if: >-
      ${{ !cancelled() && (inputs.compat || github.event_name == 'schedule') && !inputs.stress
      && needs.build.result == 'success' && needs.rproxy.result == 'success' && needs.matrix.result == 'success'
      && needs.node-images.result != 'failure' }}
    needs: [build, rproxy, matrix, node-images]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    env:
      KIND_NODE_IMAGE: ${{ matrix.image }}
      GATEWAY_API_VERSION: ${{ matrix.gwapi }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # the binaries only (rproxy-gateway, rproxy-api), not the reports other jobs upload meanwhile
          pattern: rproxy-*
          path: dist/amd64
          merge-multiple: true
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${{ needs.matrix.outputs.kind }}/kind-linux-amd64"
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - name: node image from GHCR
        if: ${{ startsWith(matrix.image, 'ghcr.io/') }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull -q "${{ matrix.image }}"
      - name: relax the chart's kubeVersion (floor runs only)
        if: ${{ matrix.floor }}
        run: |
          sed -i 's/^kubeVersion:.*/kubeVersion: ">=1.18.0-0"/' charts/rproxy-gateway/Chart.yaml
      # rproxy-gateway works here: the same e2e as on every PR, against this Kubernetes and these CRDs
      - name: scripts/e2e.sh
        id: e2e
        continue-on-error: ${{ matrix.floor == true }}
        env:
          MIGRATE: e2e/e2e
          GATEWAY_API_CHANNEL: experimental
        run: scripts/e2e.sh
      - name: controller log
        if: always()
        run: kubectl -n rproxy-gateway-system logs deploy/rproxy-gateway --tail=200 || true
      - name: delete the e2e cluster
        if: always()
        run: kind delete cluster --name rproxy-gateway || true
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      # strict pairs must pass core; the others are recorded (an older suite does not know the newer features)
      - name: scripts/conformance.sh
        id: conformance
        continue-on-error: ${{ !matrix.strict }}
        run: scripts/conformance.sh
      - name: core (strict pairs)
        if: ${{ matrix.strict }}
        run: |
          f="$RUNNER_TEMP/rproxy-gateway-conformance/core-failures"
          if [ -s "$f" ]; then echo "::error::conformance core failed on k8s ${{ matrix.k8s }}, Gateway API ${{ matrix.gwapi }}"; cat "$f"; exit 1; fi
      # one line per pair for the compatibility report (docs/COMPATIBILITY.md)
      - name: result
        if: always()
        run: |
          w="$RUNNER_TEMP/rproxy-gateway-conformance"
          log="$w/conformance.log"
          mkdir -p "$w"; [ -f "$log" ] || : > "$log"
          passed=$(grep -cE '^\s*--- PASS' "$log" || true)
          failed=$(grep -cE '^\s*--- FAIL' "$log" || true)
          failures=$(grep -E '^\s*--- FAIL' "$log" | sed 's/^\s*--- FAIL: //; s/ (.*//' | paste -sd';' - || true)
          jq -n --arg k8s "${{ matrix.k8s }}" --arg gwapi "${{ matrix.gwapi }}" \
            --arg kind "${{ matrix.floor && 'floor' || (matrix.strict && 'strict' || 'recorded') }}" \
            --arg e2e "${{ steps.e2e.outcome }}" --arg conformance "${{ steps.conformance.outcome }}" \
            --argjson passed "${passed:-0}" --argjson failed "${failed:-0}" --arg failures "$failures" \
            --arg core "$(cat "$w/core-failures" 2>/dev/null || true)" \
            '$ARGS.named' | tee result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-${{ matrix.k8s }}-${{ matrix.gwapi }}
          path: |
            result.json
            conformance-report.yaml
            ${{ runner.temp }}/rproxy-gateway-conformance/conformance.log
            ${{ runner.temp }}/rproxy-gateway-conformance/controller.log

  # one table of every pair; a failing weekly run opens an issue (or comments on the open one)
  compat-summary:
    name: compat summary
    needs: [matrix, compat]
    if: ${{ !cancelled() && needs.matrix.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: compat-*
          path: compat
      - name: table
        run: |
          {
            echo "## Compatibility: every pair (run ${{ github.run_id }})"
            echo
            echo "| Kubernetes | Gateway API | kind | e2e | conformance passed | failed tests | core failures |"
            echo "|---|---|---|---|---|---|---|"
            find compat -name result.json -print0 | xargs -0 cat | jq -s -r 'sort_by(.k8s, .gwapi) | reverse | .[]
              | (.failures | split(";") | map(select(. != "TestConformance" and (ltrimstr("TestConformance/") | contains("/") | not))) | map(ltrimstr("TestConformance/")) | join(", ")) as $f
              | "| \(.k8s) | \(.gwapi) | \(.kind) | \(.e2e) | \(.passed) | \($f) | \(.core | gsub("\n"; "; ")) |"'
          } | tee table.md >> "$GITHUB_STEP_SUMMARY"
      - name: issue (weekly run failed)
        if: ${{ github.event_name == 'schedule' && needs.compat.result == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly compatibility run failed"
          body=$(printf 'The weekly compatibility run failed: %s\n\nA strict pair (the latest two Gateway API minors) failed conformance core, or the e2e failed on a Kubernetes the chart allows.\n\n%s\n' "$RUN_URL" "$(cat table.md)")
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi

  stress:
    name: stress (random traffic)
    if: ${{ inputs.stress }}
    needs: [build, rproxy]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          # the binaries only (rproxy-gateway, rproxy-api), not the reports other jobs upload meanwhile
          pattern: rproxy-*
          path: dist/amd64
          merge-multiple: true
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: scripts/stress.sh
        env:
          TOTAL: ${{ inputs.stress_total }}
        run: scripts/stress.sh
      - name: controller and rproxy logs
        if: always()
        run: |
          kubectl -n rproxy-gateway-system logs deploy/rproxy-gateway --tail=100 || true
          kubectl -n stress logs -l gateway.networking.k8s.io/gateway-name=stress -c rproxy --tail=100 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress
          path: ${{ runner.temp }}/rproxy-gateway-stress/

  report:
    name: conformance report (published)
    if: ${{ inputs.report_version != '' && inputs.report_version != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: scripts/conformance-report.sh
        env:
          VERSION: ${{ inputs.report_version }}
          GATEWAY_API_CHANNEL: ${{ inputs.report_channel }}
          OUT_DIR: ${{ github.workspace }}/conformance-report
        run: scripts/conformance-report.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report-v${{ inputs.report_version }}
          path: conformance-report/
