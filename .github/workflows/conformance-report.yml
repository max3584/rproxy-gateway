name: conformance-report

# The Gateway API conformance report for submission to kubernetes-sigs/gateway-api
# (conformance/reports/<minor>/max3584-rproxy-gateway/), from the PUBLISHED chart and images of a
# released version (scripts/conformance-report.sh): nothing is built from this ref. By hand only, e.g.
#   gh workflow run conformance-report.yml -f version=0.4.5
# The report (<channel>-v<version>-default-report.yaml, as the suite wrote it), the suite's log, the
# controller's log and the environment (versions, image digests) are the artifact
# conformance-report-v<version>. The job fails unless every profile is core and extended success
# with nothing skipped.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "released rproxy-gateway version (chart version; the report's implementation.version is v<version>)"
        required: false
        default: "0.4.5"
      gateway_api_version:
        description: "Gateway API version (CRDs and the conformance suite's tag)"
        required: false
        default: v1.6.3
      channel:
        description: "Gateway API channel of the CRDs (experimental: the claimed HTTPRouteRetry* use experimental fields)"
        required: false
        default: experimental
        type: choice
        options: [experimental, standard]

permissions:
  contents: read

jobs:
  report:
    name: conformance report (published)
    # kind runs the cluster's nodes as Docker containers: on the runner VM (CLAUDE.md)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: kind
        run: |
          curl -sLo "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          sudo install -m 755 "$RUNNER_TEMP/kind" /usr/local/bin/kind
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: scripts/conformance-report.sh
        env:
          VERSION: ${{ inputs.version }}
          GATEWAY_API_VERSION: ${{ inputs.gateway_api_version }}
          GATEWAY_API_CHANNEL: ${{ inputs.channel }}
          OUT_DIR: ${{ github.workspace }}/conformance-report
        run: scripts/conformance-report.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report-v${{ inputs.version }}
          path: conformance-report/
