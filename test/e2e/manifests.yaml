# e2e (scripts/e2e.sh): one Gateway with HTTP, HTTPS, TCP and UDP listeners, the
# routes for each, an RproxyMiddleware, and (migration) an Ingress and an IngressRoute.
apiVersion: v1
kind: Namespace
metadata: {name: e2e}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: echo, namespace: e2e}
spec:
  replicas: 2
  selector: {matchLabels: {app: echo}}
  template:
    metadata: {labels: {app: echo}}
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
          env:
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
---
apiVersion: v1
kind: Service
metadata: {name: echo, namespace: e2e}
spec:
  selector: {app: echo}
  ports: [{name: http, port: 8080, targetPort: 3000}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: e2e, namespace: e2e}
spec:
  gatewayClassName: rproxy
  infrastructure:
    labels: {team: e2e}
    annotations: {e2e.example.com/note: infrastructure}
  listeners:
    - {name: http, port: 80, protocol: HTTP}
    - name: https
      port: 443
      protocol: HTTPS
      hostname: secure.example.com
      tls: {certificateRefs: [{name: secure-cert}]}
    - {name: tcp, port: 9000, protocol: TCP}
    - {name: udp, port: 5353, protocol: UDP}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: echo, namespace: e2e}
spec:
  parentRefs: [{name: e2e, sectionName: http}, {name: e2e, sectionName: https}]
  hostnames: [e2e.example.com, secure.example.com]
  rules:
    - matches: [{path: {type: PathPrefix, value: /limited}}]
      filters: [{type: ExtensionRef, extensionRef: {group: rproxy.max3584.net, kind: RproxyMiddleware, name: one-per-minute}}]
      backendRefs: [{name: echo, port: 8080}]
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier: {set: [{name: X-E2e, value: rproxy}]}
      backendRefs: [{name: echo, port: 8080}]
---
apiVersion: rproxy.max3584.net/v1alpha1
kind: RproxyMiddleware
metadata: {name: one-per-minute, namespace: e2e}
spec: {rate_limit: {average: 1, period: 1m, burst: 1}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata: {name: echo, namespace: e2e}
spec:
  parentRefs: [{name: e2e, sectionName: tcp}]
  rules: [{backendRefs: [{name: echo, port: 8080}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata: {name: dns, namespace: e2e}
spec:
  parentRefs: [{name: e2e, sectionName: udp}]
  rules: [{backendRefs: [{name: kube-dns, namespace: kube-system, port: 53}]}]
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata: {name: e2e-dns, namespace: kube-system}
spec:
  from: [{group: gateway.networking.k8s.io, kind: UDPRoute, namespace: e2e}]
  to: [{group: "", kind: Service, name: kube-dns}]
---
# migration (the chart is installed with migration.migrateTo=e2e/e2e)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: legacy, namespace: e2e}
spec:
  ingressClassName: rproxy
  rules:
    - host: ingress.example.com
      http:
        paths: [{path: /, pathType: Prefix, backend: {service: {name: echo, port: {number: 8080}}}}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: strip, namespace: e2e}
spec: {stripPrefix: {prefixes: [/traefik]}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: legacy, namespace: e2e}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`traefik.example.com`) && PathPrefix(`/traefik`)
      middlewares: [{name: strip}]
      services: [{name: echo, port: 8080}]
---
# a reference to another namespace without a ReferenceGrant: not converted (scripts/e2e.sh, H2)
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: cross, namespace: e2e}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`cross.example.com`)
      kind: Rule
      services: [{name: kubernetes, namespace: default, port: 443}]
