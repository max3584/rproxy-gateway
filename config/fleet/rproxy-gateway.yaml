# fleet mode: rproxy on every node (hostNetwork), serving every Gateway. The controller
# PUTs each Gateway's rule set to every pod. The control API is TLS + token (Secrets the
# controller creates on its first start: install the chart, then the DaemonSet's pods start).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rproxy
  namespace: rproxy-gateway-system
  labels:
    app.kubernetes.io/part-of: rproxy-gateway
    app.kubernetes.io/name: rproxy
    app.kubernetes.io/component: fleet
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rproxy
      app.kubernetes.io/component: fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rproxy
        app.kubernetes.io/component: fleet
    spec:
      serviceAccountName: rproxy-gateway-proxy
      # rproxy and certsync do not use the Kubernetes API: certificates come as a mounted Secret
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      # Ready once the controller has applied every Gateway's rule set (a rolling update waits for it)
      readinessGates:
        - conditionType: rproxy.max3584.net/ruleset-applied
      hostNetwork: true
      # rproxy's shutdown delay and drain, and 5 s to stop
      terminationGracePeriodSeconds: 35
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: rproxy
          image: ghcr.io/max3584/rproxy-gateway/rproxy:0.4.5
          imagePullPolicy: IfNotPresent
          env:
            # the pod's IP (with hostNetwork, the node's): not every interface
            - name: RPROXY_API_ADDR
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: RPROXY_API_PORT, value: "9443"}
            - {name: RPROXY_TOKEN_FILE, value: /etc/rproxy-gateway/token/tokens.yaml}
            - {name: RPROXY_TLS_CERT, value: /etc/rproxy-gateway/api-tls/tls.crt}
            - {name: RPROXY_TLS_KEY, value: /etc/rproxy-gateway/api-tls/tls.key}
            # the kubelet mounts Secrets as root: rproxy may use root's files in these directories
            - {name: RPROXY_FILES_TRUSTED_DIRS, value: "/var/run/rproxy-gateway/certs,/etc/rproxy-gateway/api-tls,/etc/rproxy-gateway/token"}
            # SIGTERM: keep accepting (GET /readyz: draining), then let connections end (rproxy v0.4.1)
            - {name: RPROXY_SHUTDOWN_DELAY, value: "5s"}
            - {name: RPROXY_SHUTDOWN_DRAIN, value: "25s"}
          ports:
            - {name: api, containerPort: 9443}
          livenessProbe:
            httpGet: {path: /healthz, port: 9443, scheme: HTTPS}
          # root with only NET_BIND_SERVICE: listens on the node's low ports
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: token, mountPath: /etc/rproxy-gateway/token, readOnly: true}
            - {name: api-tls, mountPath: /etc/rproxy-gateway/api-tls, readOnly: true}
            - {name: certs, mountPath: /var/run/rproxy-gateway/certs, readOnly: true}
        - name: certsync
          image: ghcr.io/max3584/rproxy-gateway:0.4.7
          imagePullPolicy: IfNotPresent
          # tells the controller which certificate files the kubelet has put in place
          args: [certsync, --dir=/var/run/rproxy-gateway/certs, --listen=0.0.0.0:9444]
          env:
            # listen on the pod's IP only
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: certsync, containerPort: 9444}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: certs, mountPath: /var/run/rproxy-gateway/certs, readOnly: true}
      volumes:
        - name: token
          secret:
            secretName: rproxy-gateway-token
            items: [{key: tokens.yaml, path: tokens.yaml}]
        - name: api-tls
          secret: {secretName: rproxy-gateway-api-tls}
        # every Gateway's certificate files, written by the controller
        - name: certs
          secret: {secretName: rproxy-fleet-certs, defaultMode: 288, optional: true}  # 0440
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rproxy-gateway
  namespace: rproxy-gateway-system
  labels:
    app.kubernetes.io/part-of: rproxy-gateway
    app.kubernetes.io/name: rproxy-gateway
spec:
  # replicas elect a leader (a Lease): one renders and PUTs every Gateway's rule set,
  # the others take over within ~15 s when it goes
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: rproxy-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rproxy-gateway
      annotations:
        # a changed configuration rolls the controller
        rproxy.max3584.net/config: 4a639af31bf44dcc
    spec:
      serviceAccountName: rproxy-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: ghcr.io/max3584/rproxy-gateway:0.4.7
          imagePullPolicy: IfNotPresent
          # the settings are in the ConfigMap rproxy-gateway-config (RPROXY_GATEWAY_* environment
          # variables, so Kustomize can change them); extraArgs win over them (arguments beat the environment)
          args:
            - controller
          envFrom:
            - configMapRef: {name: rproxy-gateway-config}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      # replicas on different nodes when there are several
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rproxy-gateway}
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: rproxy
  labels:
    app.kubernetes.io/part-of: rproxy-gateway
spec:
  controllerName: rproxy.max3584.net/gateway-controller
  description: rproxy (rproxy-gateway)
