  namespace: rproxy-gateway-system
  labels:
    app.kubernetes.io/part-of: rproxy-gateway
    app.kubernetes.io/name: rproxy-gateway
spec:
  # replicas elect a leader (a Lease): one renders and PUTs every Gateway's rule set,
  # the others take over within ~15 s when it goes
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: rproxy-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rproxy-gateway
      annotations:
        # a changed configuration rolls the controller
        rproxy.max3584.net/config: 86c00659ecc6146a
    spec:
      serviceAccountName: rproxy-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: ghcr.io/max3584/rproxy-gateway:0.4.3
          imagePullPolicy: IfNotPresent
          # the settings are in the ConfigMap rproxy-gateway-config (RPROXY_GATEWAY_* environment
          # variables, so Kustomize can change them); extraArgs win over them (arguments beat the environment)
          args:
            - controller
          envFrom:
            - configMapRef: {name: rproxy-gateway-config}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 20m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      # replicas on different nodes when there are several
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rproxy-gateway}
