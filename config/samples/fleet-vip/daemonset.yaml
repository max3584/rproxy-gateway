# Generated by scripts/render-config.sh from charts/rproxy-gateway; do not edit.
# fleet mode: rproxy on every node (hostNetwork), serving every Gateway. The controller
# PUTs each Gateway's rule set to every pod. The control API is TLS + token (Secrets the
# controller creates on its first start: install the chart, then the DaemonSet's pods start).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rproxy
  namespace: rproxy-gateway-system
  labels:
    app.kubernetes.io/part-of: rproxy-gateway
    app.kubernetes.io/name: rproxy
    app.kubernetes.io/component: fleet
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: rproxy
      app.kubernetes.io/component: fleet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rproxy
        app.kubernetes.io/component: fleet
    spec:
      # the vip sidecar's identity (the VIPs' Leases); only that container gets its token
      serviceAccountName: rproxy-gateway-vip
      # rproxy and certsync do not use the Kubernetes API: certificates come as a mounted Secret
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      # Ready once the controller has applied every Gateway's rule set (a rolling update waits for it)
      readinessGates:
        - conditionType: rproxy.max3584.net/ruleset-applied
      hostNetwork: true
      # rproxy's shutdown delay and drain, and 5 s to stop
      terminationGracePeriodSeconds: 35
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: rproxy
          image: ghcr.io/max3584/rproxy-gateway/rproxy:0.4.1
          imagePullPolicy: IfNotPresent
          env:
            # the pod's IP (with hostNetwork, the node's): not every interface
            - name: RPROXY_API_ADDR
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: RPROXY_API_PORT, value: "9443"}
            - {name: RPROXY_TOKEN_FILE, value: /etc/rproxy-gateway/token/tokens.yaml}
            - {name: RPROXY_TLS_CERT, value: /etc/rproxy-gateway/api-tls/tls.crt}
            - {name: RPROXY_TLS_KEY, value: /etc/rproxy-gateway/api-tls/tls.key}
            # the kubelet mounts Secrets as root: rproxy may use root's files in these directories
            - {name: RPROXY_FILES_TRUSTED_DIRS, value: "/var/run/rproxy-gateway/certs,/etc/rproxy-gateway/api-tls,/etc/rproxy-gateway/token"}
            # SIGTERM: keep accepting (GET /readyz: draining), then let connections end (rproxy v0.4.1)
            - {name: RPROXY_SHUTDOWN_DELAY, value: "5s"}
            - {name: RPROXY_SHUTDOWN_DRAIN, value: "25s"}
          ports:
            - {name: api, containerPort: 9443}
          livenessProbe:
            httpGet: {path: /healthz, port: 9443, scheme: HTTPS}
          # root with only NET_BIND_SERVICE: listens on the node's low ports
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - {name: token, mountPath: /etc/rproxy-gateway/token, readOnly: true}
            - {name: api-tls, mountPath: /etc/rproxy-gateway/api-tls, readOnly: true}
            - {name: certs, mountPath: /var/run/rproxy-gateway/certs, readOnly: true}
        - name: certsync
          image: ghcr.io/max3584/rproxy-gateway:0.4.3
          imagePullPolicy: IfNotPresent
          # tells the controller which certificate files the kubelet has put in place
          args: [certsync, --dir=/var/run/rproxy-gateway/certs, --listen=0.0.0.0:9444]
          env:
            # listen on the pod's IP only
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {name: certsync, containerPort: 9444}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: certs, mountPath: /var/run/rproxy-gateway/certs, readOnly: true}
        # holds the VIPs (fleet.vip, docs/DESIGN-v0.4.x.md 7.): a Lease per VIP; the holder adds it to the
        # node's interface and announces it, while this pod's rproxy is ready and has its rule sets
        - name: vip
          image: ghcr.io/max3584/rproxy-gateway:0.4.3
          imagePullPolicy: IfNotPresent
          args: [vip]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - {name: RPROXY_VIPS, value: "[\"192.0.2.10\"]"}
            - {name: RPROXY_VIP_INTERFACE, value: ""}
            - {name: RPROXY_GATEWAY_ADDRESS_CIDR, value: "192.0.2.0/24"}
            - {name: RPROXY_VIP_LEASE_DURATION, value: "3s"}
            - {name: RPROXY_VIP_RENEW_INTERVAL, value: "1s"}
            - {name: RPROXY_VIP_RETRY_INTERVAL, value: "500ms"}
            - {name: RPROXY_VIP_GARP_COUNT, value: "3"}
            - {name: RPROXY_VIP_GARP_INTERVAL, value: "200ms"}
            - {name: RPROXY_VIP_ON_API_UNREACHABLE, value: "hold"}
            - {name: RPROXY_GATEWAY_LOG_FORMAT, value: "json"}
          ports:
            - {name: vip-metrics, containerPort: 9445}
          livenessProbe:
            httpGet: {path: /healthz, port: 9445}
            periodSeconds: 10
          # root with only NET_ADMIN (the VIP on the node's interface) and NET_RAW (ARP, neighbor
          # advertisements) in the node's network namespace (hostNetwork)
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL], add: [NET_ADMIN, NET_RAW]}
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
          volumeMounts:
            - {name: vip-api-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: api-ca, mountPath: /etc/rproxy-gateway/api-tls, readOnly: true}
      volumes:
        # the vip container's API token (this pod's ServiceAccount, rproxy-gateway-vip)
        - name: vip-api-token
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3607}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
        # the CA of rproxy's control API certificate only (vip reads rproxy's /readyz)
        - name: api-ca
          secret: {secretName: rproxy-gateway-api-tls, items: [{key: ca.crt, path: ca.crt}]}
        - name: token
          secret:
            secretName: rproxy-gateway-token
            items: [{key: tokens.yaml, path: tokens.yaml}]
        - name: api-tls
          secret: {secretName: rproxy-gateway-api-tls}
        # every Gateway's certificate files, written by the controller
        - name: certs
          secret: {secretName: rproxy-fleet-certs, defaultMode: 288, optional: true}  # 0440
