# Generated by scripts/render-config.sh from charts/rproxy-gateway; do not edit.
# fleet with VIPs held by the fleet's pods (the chart's fleet.vip): the example VIP 192.0.2.10 in 192.0.2.0/24. The
# vip sidecar's ServiceAccount, RBAC and the VIP's Lease (vip.yaml), the DaemonSet with the sidecar
# (daemonset.yaml, a patch), and the controller's settings. The Lease's name and the Role's resourceNames
# are a hash of the address: for your VIPs, render the chart (helm template --set fleet.vip.enabled=true ...)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../fleet
  - vip.yaml
patches:
  - path: daemonset.yaml
configMapGenerator:
  - name: rproxy-gateway-config
    namespace: rproxy-gateway-system
    behavior: merge
    literals:
      - RPROXY_GATEWAY_FLEET_VIPS=192.0.2.10
      - RPROXY_GATEWAY_ADDRESS_CIDR=192.0.2.0/24
