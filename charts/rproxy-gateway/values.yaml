# rproxy-gateway: Gateway API controller for rproxy (docs/DESIGN.md).
# Gateway API's CRDs are not part of this chart: install them first
# (https://gateway-api.sigs.k8s.io/guides/#installing-gateway-api, v1.6 standard channel; the experimental channel for HTTPRoute retries).

controller:
  image:
    repository: ghcr.io/max3584/rproxy-gateway
    # defaults to the chart's appVersion
    tag: ""
    # sha256:...: pins the image (used instead of the tag)
    digest: ""
    pullPolicy: IfNotPresent
  # replicas elect a leader with a Lease (rproxy-gateway in the release namespace); one acts at a time
  replicas: 2
  leaderElection: true
  # GatewayClass spec.controllerName this controller handles
  controllerName: rproxy.max3584.net/gateway-controller
  logFormat: json
  # seconds between full passes (also how soon an rproxy restart is noticed without a pod event)
  resyncSeconds: 30
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # extra arguments of `rproxy-gateway controller` (the other settings are in the ConfigMap
  # rproxy-gateway-config as RPROXY_GATEWAY_* variables; arguments win over them)
  extraArgs: []
  # watch only these namespaces (and the release namespace): the controller then gets Roles there
  # instead of a ClusterRole for namespaced objects. Empty: every namespace (docs/SECURITY.md)
  watchNamespaces: []
  # certificateRefs may name Secrets of other namespaces (with a ReferenceGrant); managed mode copies
  # those keys into the Gateway's namespace (docs/SECURITY.md)
  crossNamespaceSecrets: true
  # ExternalName Services as backends (they can name anything: the API server, other namespaces)
  allowExternalNameServices: false

# rproxy itself (the data plane)
rproxy:
  image:
    repository: ghcr.io/max3584/rproxy-gateway/rproxy
    tag: "0.4.2"
    digest: ""
    pullPolicy: IfNotPresent
  # addresses rules listen on (the first is listen_addr, the rest extra_listen_addrs); add "::" for IPv6
  listenAddresses: ["0.0.0.0"]

# managed mode (default): one rproxy Deployment, Service and ServiceAccount per Gateway, in the Gateway's namespace
managed:
  # 2 or more: the pods spread over nodes, and each Gateway gets a PodDisruptionBudget (maxUnavailable 1)
  replicas: 1
  # type of each Gateway's Service: LoadBalancer, NodePort or ClusterIP
  serviceType: LoadBalancer
  # IP ranges Gateways' spec.addresses may take (the Service's externalIPs). Empty: static addresses
  # are off. Never include the Service or pod ranges (a Gateway could capture another Service's traffic)
  addressCIDRs: []
  # spec.infrastructure annotation prefixes let onto the Service though they ask load balancers for
  # addresses (metallb.universe.tf/, service.beta.kubernetes.io/, ...; off by default)
  serviceAnnotationPrefixes: []
  # a NetworkPolicy per Gateway: only the controller reaches rproxy's control API and certsync
  networkPolicy: true
  # externalTrafficPolicy of the Service (LoadBalancer, NodePort). Local: clients' source addresses
  # are kept and only nodes with a ready rproxy pod take traffic (load balancers check the Service's
  # healthCheckNodePort); Cluster: every node forwards to any rproxy pod (smoother failover when a
  # node or the announcing node goes; clients' addresses are lost). Empty: Local for LoadBalancer,
  # Cluster for NodePort (docs/DESIGN.md, "Availability")
  externalTrafficPolicy: ""
  # LoadBalancer Services get node ports (false for load balancers that do not use them, e.g. MetalLB)
  allocateLoadBalancerNodePorts: true
  # how rproxy stops on SIGTERM (rproxy 0.4.1, features.graceful_shutdown; docs/DESIGN.md, "rproxy
  # availability"): it keeps accepting for `delay` while GET /readyz says "draining" (the readiness
  # probe takes the pod out of the Service and load balancers move away), then closes its listeners and
  # lets connections end for up to `drain`. terminationGracePeriodSeconds is both and 5 s more. Per
  # Gateway: the parameters' rproxy.shutdown
  shutdown: {delay: 15s, drain: 25s}
  # seconds a stopping rproxy pod keeps serving in a preStop before SIGTERM. Unset (0.4.2 and later):
  # none with an rproxy that has a graceful shutdown (the delay above does it), 15 for older rproxy
  # images (which stop at once on SIGTERM; terminationGracePeriodSeconds is 15 more). Set: this preStop
  # for every pod, before the delay and drain. 0: none
  preStopSeconds: null
  # rproxy's probes. Readiness: how soon a hung rproxy leaves the endpoints, and its path: /readyz (also
  # not ready while starting and stopping) or /healthz (older rproxy images: always /healthz); liveness
  # (/healthz): when the kubelet restarts it (kept slow). A pod takes traffic only once the controller
  # has applied its rule set (the readiness gate rproxy.max3584.net/ruleset-applied)
  readinessProbe: {path: /readyz, periodSeconds: 2, timeoutSeconds: 1, failureThreshold: 2, successThreshold: 1, initialDelaySeconds: 0}
  livenessProbe: {periodSeconds: 5, timeoutSeconds: 1, failureThreshold: 3, initialDelaySeconds: 0}
  # the spec of an RproxyGatewayParameters the GatewayClass names (rproxy-default in the release
  # namespace): every managed Gateway's defaults and, in `policy`, what Gateways' own parameters
  # (spec.infrastructure.parametersRef) may set (docs/DESIGN-v0.4.x.md, A). Empty: none (the flags
  # above). Upgrading from 0.4.1, apply the chart's CRDs first: helm upgrade does not install new ones
  #   parameters:
  #     pod: {resources: {rproxy: {requests: {cpu: 100m, memory: 64Mi}}}}
  #     policy: {maxReplicas: 5, gatewayOverrides: [replicas, pod.resources, pod.tolerations]}
  parameters: {}

# fleet mode: rproxy pods deployed by this chart serve every Gateway (rproxy-api docs/DESIGN-v0.4.md 3.3)
fleet:
  enabled: false
  # DaemonSet with hostNetwork: true (L4 and UDP work plainly on the node addresses)
  hostNetwork: true
  # addresses written to Gateway status (default: the nodes' IPs)
  addresses: []
  nodeSelector: {}
  tolerations: []
  resources: {}
  # how rproxy stops on SIGTERM (a rolling update, a drained node): it keeps accepting for `delay`
  # with GET /readyz (https://<node>:9443/readyz) saying "draining", then closes its listeners and lets
  # connections end for `drain` (RPROXY_SHUTDOWN_DELAY / _DRAIN; terminationGracePeriodSeconds is both
  # and 5 s more). Make `delay` as long as your load balancer or VIP takes to move away from a node
  # (its health check on /readyz: interval x failures)
  shutdown: {delay: 5s, drain: 25s}
  # RproxyRules (off: the fleet's pods are shared by every Gateway; fleet is for one trust domain)
  rproxyRules: false
  # where Gateways' listeners listen: wildcard (rproxy.listenAddresses on every node: one Gateway per
  # port) or addresses (a Gateway with spec.addresses listens on those only, inside
  # managed.addressCIDRs, whether a node has them yet or not: Gateways on different addresses can use
  # the same port, and traffic to an address reaches only its Gateways; the platform puts the
  # addresses on the nodes: MetalLB, kube-vip, keepalived... Gateways without spec.addresses keep the
  # wildcard). addresses needs rproxy v0.4.3 (listen_freebind); with an older rproxy the wildcard is kept
  listen: wildcard
  # VIPs held by the fleet's pods directly, without a Service or load balancer (docs/DESIGN-v0.4.x.md 7.):
  # a `vip` sidecar (rproxy-gateway vip; NET_ADMIN and NET_RAW in that container only) per pod. One
  # Lease per VIP (rproxy-vip-<hash>, made by the chart) decides which pod has it; the holder adds it to
  # its node's interface and announces it (gratuitous ARP, unsolicited NA for IPv6). A pod holds VIPs
  # only while its rproxy is ready (/readyz) and the controller has applied the rule sets to it; it lets
  # them go first when rproxy drains (SIGTERM), the pod stops or the node is cordoned (a planned move
  # takes well under a second; a lost node the Lease's duration). The VIPs become the fleet's addresses
  # (instead of `addresses` above); Gateways pick some with spec.addresses (none: all). Needs hostNetwork,
  # VIPs inside managed.addressCIDRs, and the namespace's PodSecurity at privileged (docs/SECURITY.md)
  vip:
    enabled: false
    # canonical addresses ("192.0.2.10", "2001:db8::10"; IPv6 needs "::" in rproxy.listenAddresses),
    # or {address, interface, nodeSelector} (the nodes that may hold it, by labels)
    addresses: []
    # the interface of VIPs that name none; empty: the one whose subnet holds the VIP
    interface: ""
    # the Lease: held this long without a renewal (whole seconds), renewed this often, a failed write
    # tried again this soon (also how often rproxy's /readyz is read)
    leaseDuration: 3s
    renewInterval: 1s
    retryInterval: 500ms
    # gratuitous ARPs (IPv6: unsolicited NAs) sent after taking a VIP
    garp: {count: 3, interval: 200ms}
    # the API server cannot be reached: hold (keep the VIP while rproxy is ready; another MAC announcing
    # it makes the pod let go) or release (drop it when the Lease would have expired)
    onApiUnreachable: hold
    # /metrics (rproxy_vip_held, rproxy_vip_transitions_total) and /healthz on the node's IP
    metricsPort: 9445
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}

# a GatewayClass for this controller
gatewayClass:
  create: true
  name: rproxy

# the UI (TCP-UDP-rproxy-ui's chart, installed apart; docs/SECURITY.md): with a namespace, the
# controller writes the Secret rproxy-ui-discovery there: the rproxy pods of the Gateways shown to
# the UI (RproxyGatewayParameters ui.visible, true unless set false), the control API's CA certificate
# and per Gateway a token rproxy takes for reading only (rules:read, metrics:read). The Gateways'
# NetworkPolicy lets the UI's pods (podSelector, in that namespace) reach the control API (9443).
# The controller gets a Role there for that one Secret. Empty: off (nothing is written)
ui:
  namespace: ""
  # the UI pods' labels: the UI chart's UI pods only (not its migration and backup pods). Helm merges
  # maps: set a key to null to drop it
  podSelector:
    app.kubernetes.io/name: rproxy-ui
    app.kubernetes.io/component: ui

# migration from Ingress and Traefik (docs/MIGRATION.md): off unless migrateTo is set
migration:
  # namespace/name of the Gateway whose rule set gets Ingress and Traefik routes
  migrateTo: ""
  ingressClass: rproxy
  # Traefik entry points name=port[/udp]
  traefikEntryPoints: ["web=80", "websecure=443"]
  # also create an IngressClass for ingressClass
  createIngressClass: false
  # references to other namespaces without a ReferenceGrant (Traefik's allowCrossNamespace)
  allowCrossNamespace: false

rbac:
  # a ClusterRole aggregated to namespace admins (not edit): they write RproxyGatewayParameters for
  # their Gateways (bounded by the GatewayClass's parameters' policy)
  aggregateToAdmin: true

imagePullSecrets: []

# for scripts/render-config.sh (config/, the releases' install.yaml): no Helm labels on what is rendered
rendered: false
