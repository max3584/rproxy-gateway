apiVersion: v1
kind: ServiceAccount
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
---
# rproxy pods: certsync reads the certificate Secrets of this namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rproxy-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: true
