apiVersion: v1
kind: ServiceAccount
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
---
# rproxy pods: no RBAC and no token (certificates come as a mounted Secret, not through the API)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rproxy-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
