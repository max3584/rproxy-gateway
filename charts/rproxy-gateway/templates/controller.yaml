apiVersion: apps/v1
kind: Deployment
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rproxy-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: rproxy-gateway
spec:
  # replicas elect a leader (a Lease): one renders and PUTs every Gateway's rule set,
  # the others take over within ~15 s when it goes
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: rproxy-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rproxy-gateway
      annotations:
        # a changed configuration rolls the controller
        rproxy.max3584.net/config: {{ include "rproxy-gateway.config" . | sha256sum | trunc 16 }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: rproxy-gateway
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ include "rproxy-gateway.controllerImage" . }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          # the settings are in the ConfigMap rproxy-gateway-config (RPROXY_GATEWAY_* environment
          # variables, so Kustomize can change them); extraArgs win over them (arguments beat the environment)
          args:
            - controller
            {{- range .Values.controller.extraArgs }}
            {{- if . }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef: {name: rproxy-gateway-config}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controller.affinity }}
      affinity: {{- toYaml .Values.controller.affinity | nindent 8 }}
      {{- else if gt (int .Values.controller.replicas) 1 }}
      # replicas on different nodes when there are several
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rproxy-gateway}
      {{- end }}
{{- if gt (int .Values.controller.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rproxy-gateway.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rproxy-gateway
{{- end }}
