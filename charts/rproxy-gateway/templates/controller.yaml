apiVersion: apps/v1
kind: Deployment
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rproxy-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: rproxy-gateway
spec:
  # replicas elect a leader (a Lease): one renders and PUTs every Gateway's rule set,
  # the others take over within ~15 s when it goes
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: rproxy-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rproxy-gateway
      {{- with .Values.controller.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: rproxy-gateway
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: {{ include "rproxy-gateway.controllerImage" . }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - controller
            - --controller-name={{ .Values.controller.controllerName }}
            - --resync-secs={{ .Values.controller.resyncSeconds }}
            - --listen-addr={{ join "," .Values.rproxy.listenAddresses }}
            - --leader-elect={{ .Values.controller.leaderElection }}
            {{- if .Values.fleet.enabled }}
            - --mode=fleet
            - --fleet-selector=app.kubernetes.io/name=rproxy,app.kubernetes.io/component=fleet
            {{- with .Values.fleet.addresses }}
            - --fleet-address={{ join "," . }}
            {{- end }}
            {{- else }}
            - --mode=managed
            - --rproxy-image={{ include "rproxy-gateway.rproxyImage" . }}
            - --controller-image={{ include "rproxy-gateway.controllerImage" . }}
            - --image-pull-policy={{ .Values.rproxy.image.pullPolicy }}
            - --replicas={{ .Values.managed.replicas }}
            - --service-type={{ .Values.managed.serviceType }}
            - --proxy-service-account=rproxy-gateway-proxy
            {{- end }}
            {{- if .Values.migration.migrateTo }}
            - --migrate-to={{ .Values.migration.migrateTo }}
            - --ingress-class={{ .Values.migration.ingressClass }}
            - --traefik-entrypoint={{ join "," .Values.migration.traefikEntryPoints }}
            {{- end }}
            {{- range .Values.controller.extraArgs }}
            {{- if . }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: RPROXY_GATEWAY_LOG_FORMAT
              value: {{ .Values.controller.logFormat | quote }}
          ports:
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          readinessProbe:
            httpGet: {path: /healthz, port: health}
          resources: {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.controller.affinity }}
      affinity: {{- toYaml .Values.controller.affinity | nindent 8 }}
      {{- else if gt (int .Values.controller.replicas) 1 }}
      # replicas on different nodes when there are several
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: rproxy-gateway}
      {{- end }}
{{- if gt (int .Values.controller.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rproxy-gateway.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rproxy-gateway
{{- end }}
