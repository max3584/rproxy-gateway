apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rproxy-gateway
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, grpcroutes, tlsroutes, tcproutes, udproutes, referencegrants, listenersets, backendtlspolicies]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status, gateways/status, httproutes/status, grpcroutes/status, tlsroutes/status, tcproutes/status, udproutes/status, listenersets/status, backendtlspolicies/status]
    verbs: [get, update, patch]
  - apiGroups: [rproxy.max3584.net]
    resources: [rproxymiddlewares, rproxypolicies, rproxyrules]
    verbs: [get, list, watch]
  - apiGroups: [rproxy.max3584.net]
    resources: [rproxypolicies/status, rproxyrules/status]
    verbs: [get, update, patch]
  # backends (EndpointSlices), certificates (Secrets), namespace selectors
  # CA certificates (ConfigMaps with ca.crt: frontend client certificate validation, BackendTLSPolicy)
  - apiGroups: [""]
    resources: [namespaces, configmaps]
    verbs: [get, list, watch]
  # managed mode: each Gateway's rproxy (Deployment, Service, ServiceAccount, its certificate and
  # control API Secrets) next to the Gateway, in the Gateway's namespace
  - apiGroups: [""]
    resources: [services, secrets, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  # rproxy pods: the certificate Secret's hash as an annotation, so the kubelet updates the mounted files at once
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  {{- if .Values.migration.migrateTo }}
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  # the Gateway's addresses in status.loadBalancer
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [get, update, patch]
  - apiGroups: [traefik.io, traefik.containo.us]
    resources: [ingressroutes, ingressroutetcps, ingressrouteudps, middlewares, tlsoptions]
    verbs: [get, list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rproxy-gateway
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rproxy-gateway
subjects:
  - kind: ServiceAccount
    name: rproxy-gateway
    namespace: {{ .Release.Namespace }}
---
# in its own namespace: leader election
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rproxy-gateway
subjects:
  - kind: ServiceAccount
    name: rproxy-gateway
    namespace: {{ .Release.Namespace }}
