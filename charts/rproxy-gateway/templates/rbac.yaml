apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rproxy-gateway
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses, gateways, httproutes, tlsroutes, tcproutes, udproutes, referencegrants]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses/status, gateways/status, httproutes/status, tlsroutes/status, tcproutes/status, udproutes/status]
    verbs: [get, update, patch]
  - apiGroups: [rproxy.max3584.net]
    resources: [rproxymiddlewares, rproxypolicies, rproxyrules]
    verbs: [get, list, watch]
  - apiGroups: [rproxy.max3584.net]
    resources: [rproxypolicies/status, rproxyrules/status]
    verbs: [get, update, patch]
  # backends (EndpointSlices), certificates (Secrets), namespace selectors
  - apiGroups: [""]
    resources: [services, secrets, namespaces]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  {{- if .Values.migration.migrateTo }}
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [traefik.io, traefik.containo.us]
    resources: [ingressroutes, ingressroutetcps, ingressrouteudps, middlewares, tlsoptions]
    verbs: [get, list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rproxy-gateway
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rproxy-gateway
subjects:
  - kind: ServiceAccount
    name: rproxy-gateway
    namespace: {{ .Release.Namespace }}
---
# in its own namespace: the shared Secrets, the managed rproxy Deployments and Services
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rproxy-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rproxy-gateway
subjects:
  - kind: ServiceAccount
    name: rproxy-gateway
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rproxy-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rproxy-gateway-proxy
  namespace: {{ .Release.Namespace }}
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rproxy-gateway-proxy
subjects:
  - kind: ServiceAccount
    name: rproxy-gateway-proxy
    namespace: {{ .Release.Namespace }}
