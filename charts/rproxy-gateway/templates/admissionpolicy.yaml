{{- if .Values.rbac.admissionPolicy.enabled }}
{{- if semverCompare "<1.30.0-0" .Capabilities.KubeVersion.Version }}
{{- fail (printf "rbac.admissionPolicy needs Kubernetes 1.30 or later (ValidatingAdmissionPolicy v1); this cluster is %s" .Capabilities.KubeVersion.Version) }}
{{- end }}
# The controller's ClusterRole may write Services, Secrets, ServiceAccounts, Deployments, NetworkPolicies,
# PodDisruptionBudgets and pods in every namespace it watches (what managed mode creates for each Gateway).
# This policy narrows those writes to the objects the controller made: create, update and delete only what
# carries app.kubernetes.io/managed-by: rproxy-gateway (before and after the change, so a label cannot be
# added to take an object over), and pods only rproxy's (app.kubernetes.io/name: rproxy, the fleet's too).
# Statuses (pods/status, Gateway API objects) and the leader election Lease are not covered (docs/SECURITY.md).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: rproxy-gateway-managed-only
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [services, secrets, serviceaccounts, pods]
      - apiGroups: [apps]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [deployments]
      - apiGroups: [networking.k8s.io]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [networkpolicies]
      - apiGroups: [policy]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE]
        resources: [poddisruptionbudgets]
  matchConditions:
    # the controller's ServiceAccount only
    - name: controller
      expression: request.userInfo.username == "system:serviceaccount:{{ .Release.Namespace }}:rproxy-gateway"
  variables:
    - name: pod
      expression: request.resource.resource == "pods"
    # the object after the change (none on DELETE)
    - name: newOurs
      expression: >-
        request.operation == "DELETE" || (has(object.metadata.labels) && (
          ("app.kubernetes.io/managed-by" in object.metadata.labels && object.metadata.labels["app.kubernetes.io/managed-by"] == "rproxy-gateway") ||
          (variables.pod && "app.kubernetes.io/name" in object.metadata.labels && object.metadata.labels["app.kubernetes.io/name"] == "rproxy")))
    # the object before the change (none on CREATE)
    - name: oldOurs
      expression: >-
        request.operation == "CREATE" || (has(oldObject.metadata.labels) && (
          ("app.kubernetes.io/managed-by" in oldObject.metadata.labels && oldObject.metadata.labels["app.kubernetes.io/managed-by"] == "rproxy-gateway") ||
          (variables.pod && "app.kubernetes.io/name" in oldObject.metadata.labels && oldObject.metadata.labels["app.kubernetes.io/name"] == "rproxy")))
  validations:
    - expression: "!variables.pod || request.operation == 'UPDATE'"
      message: rproxy-gateway only annotates rproxy's pods (it does not create or delete pods)
    - expression: variables.newOurs && variables.oldOurs
      messageExpression: >-
        "rproxy-gateway may only " + request.operation.lowerAscii() + " " + request.resource.resource +
        " labelled app.kubernetes.io/managed-by: rproxy-gateway (rbac.admissionPolicy, docs/SECURITY.md)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: rproxy-gateway-managed-only
  labels: {{- include "rproxy-gateway.labels" . | nindent 4 }}
spec:
  policyName: rproxy-gateway-managed-only
  validationActions: {{ toJson .Values.rbac.admissionPolicy.validationActions }}
{{- end }}
